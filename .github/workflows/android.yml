name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # compileSdk 34; build-tools supplies the aapt2 the package check uses.
  SDK_PACKAGES: 'platform-tools platforms;android-34 build-tools;34.0.0'

jobs:
  # The JVM tests: the wire protocol, codecs, resampler, mixer, jitter buffer,
  # sample ring, input-route policy and capture mixing. No emulator needed, and
  # this is the job that actually catches logic regressions.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The wrapper JAR is a committed binary, so prove it is a genuine Gradle
      # release before running it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the obsolete
          # "tools" package, which Google removed from the SDK repository, so
          # sdkmanager fails. Ask for exactly what this build needs instead.
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the package-check script's own parser
        run: python3 scripts/check_apk.py --self-test

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  # Android Lint. Worth a job of its own mainly for the permission and
  # foreground-service-type checks, which are easy to get wrong and otherwise
  # only show up on a device.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the obsolete
          # "tools" package, which Google removed from the SDK repository, so
          # sdkmanager fails. Ask for exactly what this build needs instead.
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew :app:lintDebug

      # Lint only fails the build on errors, so without this the warnings would
      # never be looked at once it passes.
      - name: Lint issue summary
        if: always()
        run: python3 scripts/show_lint.py app/build/reports/lint-results-debug.xml --summary

      # Gradle's lint failure does not say what it found, and the HTML report is
      # only readable once downloaded. Put the errors in the log instead.
      - name: Show lint findings
        if: failure()
        run: python3 scripts/show_lint.py app/build/reports/lint-results-debug.xml

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

  # Compiles the Android half — the services, the MediaCodec wrappers, the
  # capture paths and the Compose UI — which the JVM tests do not touch at all,
  # then checks the built package against the product's hard constraints.
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the obsolete
          # "tools" package, which Google removed from the SDK repository, so
          # sdkmanager fails. Ask for exactly what this build needs instead.
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check the package against the specification
        run: python3 scripts/check_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Installs the APK on an emulator and checks the app actually starts. This is
  # the most an automated runner can say about the app itself: the behaviour that
  # matters needs two phones and a headset, per section 11 of the specification.
  # What it does catch is a startup crash, which otherwise only appears when
  # somebody installs the build by hand.
  smoke-test:
    name: Startup smoke test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the obsolete
          # "tools" package, which Google removed from the SDK repository, so
          # sdkmanager fails. Ask for exactly what this build needs instead.
          packages: ${{ env.SDK_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the emulator falls back to software rendering and takes
      # long enough to hit the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14
